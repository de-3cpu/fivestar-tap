<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for tapping!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10151f 0%, #1c2739 100%);
    color: #fff;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 { font-size: 1.1rem; font-weight: 500; color: #cdd8e8; margin-bottom: 4px; }
  .venuename {
    font-size: 2rem;
    font-weight: 800;
    color: #f5b301;
    line-height: 1.15;
    margin-bottom: 10px;
    text-shadow: 0 2px 18px rgba(245, 179, 1, 0.35);
    display: none;
  }
  p.sub { color: #9fb0c8; margin-bottom: 32px; font-size: 1rem; }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 20px;
    margin-bottom: 16px;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
  }
  .btn svg { width: 26px; height: 26px; flex-shrink: 0; }
  .btn.review { background: #fff; color: #1f2937; }
  .gbadge { display: flex; align-items: center; justify-content: center; }
  .gbadge svg { width: 24px; height: 24px; }
  .btn.whatsapp { background: #25D366; }
  .btn.tripadvisor { background: #34E0A1; color: #10151f; }
  .btn.tripadvisor svg { fill: #10151f; }
  .btn:active { filter: brightness(0.9); }
  footer { margin-top: 28px; font-size: 0.8rem; color: #66788f; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Thanks for tapping!</h1>
    <div class="venuename" id="venue"></div>
    <p class="sub">What would you like to do?</p>

    <a class="btn review" id="reviewBtn" href="#">
      <span class="gbadge"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
      Leave a Google Review
    </a>

    <a class="btn tripadvisor" id="taBtn" href="#" style="display:none">
      <svg viewBox="0 0 24 24" fill="#fff"><circle cx="7" cy="13" r="2.5"/><circle cx="17" cy="13" r="2.5"/><path d="M12 6c-2.5 0-4.8.6-6.8 1.7H2l1.6 2.3A6.5 6.5 0 0 0 7 19.5c1.9 0 3.6-.8 4.8-2.1l.2.3.2-.3a6.5 6.5 0 0 0 4.8 2.1 6.5 6.5 0 0 0 3.4-9.5L22 7.7h-3.2A14.3 14.3 0 0 0 12 6zm-5 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm10 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      Review on TripAdvisor
    </a>

    <a class="btn whatsapp" id="waBtn" href="#">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.03a8.1 8.1 0 0 1-4.13-1.13l-.3-.18-3.12.82.83-3.04-.2-.31a8.1 8.1 0 0 1-1.24-4.28c0-4.48 3.65-8.13 8.16-8.13 4.48 0 8.13 3.65 8.13 8.13s-3.65 8.12-8.13 8.12zm4.46-6.09c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.29.18-.53.06-.24-.12-1.03-.38-1.96-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.24-.02-.37.11-.5.11-.11.24-.29.37-.43.12-.14.16-.24.24-.41.08-.16.04-.3-.02-.43-.06-.12-.55-1.32-.75-1.81-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.43.06-.65.3-.22.24-.86.84-.86 2.05 0 1.21.88 2.37 1 2.54.12.16 1.72 2.63 4.18 3.69.58.25 1.04.4 1.4.52.59.19 1.12.16 1.54.1.47-.07 1.44-.59 1.65-1.16.2-.57.2-1.05.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>
      Want a review card for your business? WhatsApp us
    </a>

    <footer id="footer">Powered by FiveStar Malta</footer>
  </div>

<script>
  // Card URL format: ?g=<Google Place ID>&n=<Restaurant Name>&t=<TripAdvisor review URL>
  // t is optional — the TripAdvisor button only appears when it's present (paid upsell).
  // WhatsApp number is fixed (the owner's) — international format, digits only.
  const WHATSAPP_NUMBER = "35699050971";
  const WHATSAPP_TEXT = "Hi FiveStar Malta! I saw one of your review cards and I'm interested.";
  const TAP_HOST = "https://tap.fivestar-malta.com/hit";

  const params = new URLSearchParams(location.search);
  const placeId = params.get("g");
  const name = params.get("n");

  function trackTap(dest) {
    if (!placeId) return;
    const q = "?g=" + encodeURIComponent(placeId) +
              "&n=" + encodeURIComponent(name || "") +
              (dest ? "&dest=" + dest : "");
    navigator.sendBeacon(TAP_HOST + q);
  }
  trackTap();

  if (name) {
    document.getElementById("title").textContent = "Thanks for visiting";
    const v = document.getElementById("venue");
    v.textContent = name;
    v.style.display = "block";
  }

  const reviewBtn = document.getElementById("reviewBtn");
  if (placeId) {
    reviewBtn.href = "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(placeId);
    reviewBtn.addEventListener("click", () => trackTap("g"));
  } else {
    reviewBtn.style.display = "none";
  }

  const taUrl = params.get("t");
  if (taUrl && /^https:\/\/(www\.)?tripadvisor\./.test(taUrl)) {
    const taBtn = document.getElementById("taBtn");
    taBtn.href = taUrl;
    taBtn.style.display = "flex";
    taBtn.addEventListener("click", () => trackTap("t"));
  }

  document.getElementById("waBtn").href =
    "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(WHATSAPP_TEXT);
</script>
</body>
</html>
